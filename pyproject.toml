# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scam"
version = "0.3.0"
description = "Simple Code for Ablative Materials — 1-D charring ablation solver"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "h5py>=3.8"]
hdf5 = ["h5py>=3.8"]
bprime = ["cantera>=3.0", "pandas>=1.5"]
# Documentation build (Sphinx + MyST).  Deliberately NOT folded into `dev`:
# nobody running the test suite needs Sphinx.  Upper bounds are major-version
# caps only -- myst-parser has renamed `myst_enable_extensions` entries across
# majors before, and a docs build going red because upstream shipped a major is
# exactly what these prevent.  See docs/conf.py.
docs = [
    "sphinx>=7.2,<9",
    "myst-parser>=2.0,<5",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
]
# NOTE: Mutation++ is intentionally NOT listed here. It is a compiled C++ library
# with its own CMake build and has no pip distribution, so it cannot be expressed
# as a dependency. It is optional (Cantera covers every live-chemistry path);
# only compare_pato_ablation2_live_vs_pretab.py and the *_mpp_config.yaml cards
# use it. See the "Optional: Mutation++" section of README.md.
jax = ["jax[cpu]>=0.6"]
2d = ["jax[cpu]>=0.6", "h5py>=3.8"]

[project.scripts]
scam = "scam.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scam*"]

[tool.setuptools.package-data]
"scam.materials" = ["**/*.yaml", "**/*.xml"]
"scam.mechanisms" = ["*.yaml", "*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "cantera: tests requiring the Cantera library",
]
