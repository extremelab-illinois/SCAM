description: |-
  Minimal Si/O/N/C silica ablation equilibrium mechanism for SCAM equilibrium chemistry.
  Gas species are imported from Cantera's nasa_gas.yaml.
  Condensed silica is imported from Cantera's nasa_condensed.yaml.

phases:
- name: sionc_gas
  thermo: ideal-gas
  elements: [C, N, O, Si]
  species:
  - {nasa_gas.yaml/species: [C, C2, C3, CN, CO, CO2, N, N2, NO, NO2, N2O, O, O2, Si, SiO, SiO2, SiC, SiC2, SiN, Si2, Si2C, Si2N]}
  kinetics: none
  state:
    T: 300.0
    P: 101325.0

- name: silica_condensed
  thermo: fixed-stoichiometry
  elements: [O, Si]
  species:
  - {nasa_condensed.yaml/species: ['SiO2(L)']}
  state:
    T: 2000.0
    P: 101325.0
