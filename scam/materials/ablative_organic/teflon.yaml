# SPDX-License-Identifier: MIT
# PTFE / Teflon — polytetrafluoroethylene fluoropolymer.
#
# Kinetic (reaction-rate-limited) ablation closure, per Kemp (1968),
# "Surface Recession Rate of an Ablating Polymer", AIAA J. 6(9). PTFE
# depolymerizes at the surface via a bulk first-order Arrhenius reaction;
# the resulting monomer (C2F4) has such a high vapor pressure that
# boundary-layer mass transfer never limits the ablation rate — only the
# solid-state kinetics do. This is the OPPOSITE closure regime from a
# B'-table (phase-equilibrium, transport-limited) ablator: the mass-loss
# rate here is a pure function of surface temperature (see
# kinetic_ablation: below), NOT of the boundary-layer mass-transfer
# coefficient (rho_e*u_e*C_M).
#
# Validated against THREE independent literature derivations (Kemp 1968,
# Steg/Sutton 1962, Yurevich 1973), which agree on m_dot(T_w) within ±6% at
# 1000 K, and against Kemp's own published Fig. 1 (m_dot(1050K)/m_dot(950K)
# = 9.0x, matching his "nearly an order of magnitude"). A Langmuir/
# equilibrium closure for the same material overpredicts this kinetic rate
# by 4-9 orders of magnitude — see studies/teflon_ablation/ for the full
# derivation, literature review, and validation
# (compare_teflon_kinetic_models.py, why_ptfe_mdot_depends_on_Tw_not_p.md).
#
# k_virgin/k_char and cp_virgin/cp_char below are Kemp's OWN calibrated
# property fits (not generic PTFE handbook values) — they must stay
# consistent with the kinetic_ablation: constants for the closed-form
# validation above to hold. rho_virgin/rho_char = 2310 kg/m^3 is Kemp's own
# "wall/reacting density" (rho_sw), which he flags as the single largest
# uncertainty in the model. Tables are given over Kemp's validated ablation
# range (200-1200 K); SCAM's default flat extrapolation applies beyond that.
#
# The previous Gibbs-equilibrium B'-table card (superseded per the above) is
# kept at teflon_bprime_legacy.yaml for comparison/regression only.

name: PTFE
description: >
  Polytetrafluoroethylene (PTFE, commonly known by the Teflon trade name).
  Kinetic (Kemp 1968) surface ablation closure: reaction-rate-limited
  depolymerization to fluorocarbon gas, no in-depth pyrolysis, no char.
  Mass-loss rate is a pure function of surface temperature (Kemp Eq. 12),
  not of boundary-layer mass transfer.
material_category: ablative_organic
card_version: "1.0"
status: estimate

rho_virgin: 2310.0   # [kg/m^3] Kemp's rho_sw (wall/reacting density)
rho_char:   2310.0   # [kg/m^3] no char state; used as solid density for recession
gamma_resin:   1.0   # [-] single polymer phase
decomposing: false

components: []

# Kemp's k(T) = (2.89 + 0.0116*T)*1e-4 cal/(cm*s*K), converted to W/(m*K).
# NOT a generic handbook table — must match kinetic_ablation: below for
# Eq. 12 fidelity (thermal_conductivity() is evaluated at T_w to feed m_dot).
k_virgin:
  - [200.0, 0.2180]
  - [250.0, 0.2423]
  - [300.0, 0.2665]
  - [350.0, 0.2908]
  - [400.0, 0.3151]
  - [450.0, 0.3393]
  - [500.0, 0.3636]
  - [550.0, 0.3879]
  - [600.0, 0.4121]
  - [700.0, 0.4607]
  - [800.0, 0.5092]
  - [900.0, 0.5577]
  - [1000.0, 0.6063]
  - [1100.0, 0.6548]
  - [1200.0, 0.7033]

# PTFE has no char state in this sublimator/kinetic model. Duplicate the
# virgin table because some legacy mixture helpers evaluate the "char"
# branch when rho_char == rho_virgin for non-decomposing materials.
k_char:
  - [200.0, 0.2180]
  - [250.0, 0.2423]
  - [300.0, 0.2665]
  - [350.0, 0.2908]
  - [400.0, 0.3151]
  - [450.0, 0.3393]
  - [500.0, 0.3636]
  - [550.0, 0.3879]
  - [600.0, 0.4121]
  - [700.0, 0.4607]
  - [800.0, 0.5092]
  - [900.0, 0.5577]
  - [1000.0, 0.6063]
  - [1100.0, 0.6548]
  - [1200.0, 0.7033]

# Kemp's cp(T) = (15.39 + 0.0336*T) cal/(mol*K), converted to J/(kg*K)
# (M = 100.02 g/mol, C2F4 monomer basis, matching k_virgin's source).
cp_virgin:
  - [200.0, 924.90]
  - [250.0, 995.17]
  - [300.0, 1065.45]
  - [350.0, 1135.73]
  - [400.0, 1206.01]
  - [450.0, 1276.28]
  - [500.0, 1346.56]
  - [550.0, 1416.84]
  - [600.0, 1487.11]
  - [700.0, 1627.67]
  - [800.0, 1768.22]
  - [900.0, 1908.78]
  - [1000.0, 2049.33]
  - [1100.0, 2189.89]
  - [1200.0, 2330.44]

cp_char:
  - [200.0, 924.90]
  - [250.0, 995.17]
  - [300.0, 1065.45]
  - [350.0, 1135.73]
  - [400.0, 1206.01]
  - [450.0, 1276.28]
  - [500.0, 1346.56]
  - [550.0, 1416.84]
  - [600.0, 1487.11]
  - [700.0, 1627.67]
  - [800.0, 1768.22]
  - [900.0, 1908.78]
  - [1000.0, 2049.33]
  - [1100.0, 2189.89]
  - [1200.0, 2330.44]

# Fluorocarbon surface-vapor sensible enthalpy, 298 K reference. Retained
# for reference consistency in generic surface-term helpers; with
# decomposing=false and kinetic_ablation: set, it is not the source of the
# SEB's mass-removal energy (kinetic_ablation.h_ablation_reaction_coeffs is).
h_g:
  - [200.0, -1.0e5]
  - [250.0, -5.0e4]
  - [298.0,  0.0]
  - [300.0,  2.0e3]
  - [400.0,  1.1e5]
  - [500.0,  2.3e5]
  - [600.0,  3.6e5]
  - [700.0,  5.0e5]
  - [800.0,  6.5e5]
  - [900.0,  8.1e5]
  - [1000.0, 9.8e5]
  - [1200.0, 1.34e6]
  - [1500.0, 1.88e6]
  - [2000.0, 2.80e6]
  - [2500.0, 3.75e6]
  - [3000.0, 4.75e6]

emissivity: 0.9
emissivity_char: 0.9

# Kemp (1968) Eq. 12 kinetic ablation closure. See
# scam/config/material.py::KineticAblationCard and
# scam/physics/kinetic_ablation.py for the formula; all four numeric fields
# below are transcribed directly from
# studies/teflon_ablation/compare_teflon_kinetic_models.py's constants
# (B_KEMP, E_A, and the h_ablation_total/h_depoly coefficients converted via
# CAL_MOL_TO_J_KG = 4.184/0.10002) to keep the SCAM card and the validated
# study script numerically identical.
kinetic_ablation:
  B: 3.0e19                # [1/s] pre-exponential
  E_a: 347272.0             # [J/mol] activation energy (83 kcal/mol)
  # h_gw(T_w) - h_so(T_w) [J/kg] = a + b*T + c*T^2 (Eq. 12 denominator only):
  # sensible T0->T_w heating + depolymerization, from Kemp's
  # 35100 + 8.72*T + 0.0168*T^2 cal/mol.
  h_ablation_total_coeffs: [1468290.34, 364.77, 0.7028]
  # Depolymerization-only reaction enthalpy [J/kg] = a + b*T (SEB
  # mass-removal term), from Kemp's 42400 - 6.67*T cal/mol.
  h_ablation_reaction_coeffs: [1773661.27, -279.02]
