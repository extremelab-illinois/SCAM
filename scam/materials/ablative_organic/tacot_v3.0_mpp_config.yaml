# Mutation++ B' evaluator config for TACOT v3.0
# Used by MutationppEvaluator.from_config()
#
# The mixture XML (tacot_air_bprime.xml) is installed into mpp_data/mixtures/
# automatically at instantiation if mixture_src is provided.
#
# Surface mass balance convention:
#   edge gas:      air  O2:0.21 N2:0.79  (element comp: O:0.42 N:1.58)
#   pyrolysis gas: CH4:0.5551 CO:0.2418 H2O:0.2031  (C:0.206 H:0.679 O:0.115)
#   condensed:     pure graphite C(gr)

mpp:
  # Mutation++ install paths are intentionally NOT hardcoded here. They default
  # to $MPP_DIRECTORY / $MPP_DATA_DIRECTORY (Mutation++'s own environment
  # variables), falling back to ~/Mutationpp. Uncomment and set these only for a
  # non-standard install:
  #   mpp_bin:  /path/to/Mutationpp/install/bin/bprime
  #   mpp_data: /path/to/Mutationpp/data
  #   mpp_lib:  /path/to/Mutationpp/install/lib

  mixture:   tacot_air_bprime
  mixture_src: tacot_air_bprime.xml   # relative to this config file
  bl_name:   air
  pyro_name: tacot_pyro
  cp_name:   carbon

  # Grid matching the pre-computed Cantera table
  T_grid:  "250:4000:25"                          # 151 points, 250–4000 K
  P_grid:  "101.325,1013.25,10132.5,101325"       # 4 pressure levels (Pa)
  Bg_grid: "0.0,0.01,0.025,0.05,0.1,0.25,0.5,1.0,2.0"   # 9 B'g values; dense below 0.1 where B'_c is nonlinear

  # Cantera mechanism for surface_enthalpies() (same NASA-9 reference)
  cno_mechanism:    cno_ablation.yaml
  carbon_phase_file: graphite.yaml

  timeout: 300   # seconds per bprime subprocess call
