# SPDX-License-Identifier: MIT
# TACOT version 3 (air) — Theoretical Ablative Composite for Open Testing
#
# Source: TACOT_3.0.xls and PATO constantProperties (AblationTestCase_1.0/2.x).
# All values in SI units.
#
# Composition (PATO constantProperties):
#   Phase 1 (fiber):  rhoI=1600, epsI=0.10 → 160 kg/m³ apparent, nPyroReac=0 (inert)
#   Phase 2 (matrix): rhoI=1200, epsI=0.10 → 120 kg/m³ apparent, nPyroReac=3
#     Reactions 1,2,3 consume F=0.25+0.19+0.06=0.50 of phase 2 → 60 kg/m³ pyrolyzes
#     Non-reactive residual: 60 kg/m³ → implicit in rho_char
#   rho_virgin = 30 + 30 + 160 + 60 (inert) = 280 kg/m³
#   rho_char   = 160 + 60 = 220 kg/m³
#
# 2-component form: reactions 2 and 3 are merged (identical kinetics, only gas
# products differ; see docs/physics/tacot_kinetics_2rxn_vs_3rxn.md for derivation).
# Use tacot_3rxn.yaml for the exact 3-reaction form.
#
# Note: earlier TACOT cards based on Lachaud & Mansour JTHT 2014 used
# rho_char=180 based on a different microstructure interpretation.  This file
# uses the TACOT 3.0 / PATO xls value.

name: TACOT
description: "TACOT 3.0, through-thickness properties, 2-component Arrhenius (merged B1+B2)"
material_category: ablative_organic
dataset_version: "3.0"
card_version: "1.0"
status: verified

rho_virgin:  280.0   # [kg/m^3]  = 30 (A) + 30 (B1+B2 merged) + 60 (inert) + 160 (fiber)
rho_char:    220.0   # [kg/m^3]  = 60 (inert matrix residual) + 160 (fiber)
gamma_resin: 0.5

# Arrhenius kinetics — apparent densities, PATO constantProperties values.
# SCAM rate: drho_i/dt = -A_i * rho_0_i * ((rho_i - rho_r_i) / rho_0_i)^m_i
#
# resin_B merges PATO reactions 2+3 (F[2][2]=0.19 and F[2][3]=0.06, identical A/E/m).
# Correct merge: rho_0 = (0.19+0.06)*120 = 30, rho_r = 0.
# The 60 kg/m³ non-reactive matrix residual is NOT a pyrolysis product; it is
# inert from the start and is already captured in rho_char.  Setting rho_r=60
# would make SCAM's rate ∝ (rho-60)^m / 90^{m-1} instead of rho^m / 30^{m-1},
# which is 9× slower at the start — a critical error.
components:
  - name: resin_A        # PATO reaction 1: F[2][1]=0.25, rho_0=0.25*120=30
    rho_0:    30.0       # [kg/m^3]
    rho_r:     0.0       # [kg/m^3] fully converts to gas
    A_rate: 1.2e4        # [1/s]    PATO A[2][1]=12000
    E_act:  71130.89     # [J/mol]  PATO E[2][1]
    m_exp:    3.0
    h_decomp: 0.0        # [J/kg]   PATO h[2][1]=-4e6 not used (detailedSolidEnthalpies=no)

  - name: resin_B        # PATO reactions 2+3 merged: F=0.19+0.06=0.25, rho_0=0.25*120=30
    rho_0:    30.0       # [kg/m^3]
    rho_r:     0.0       # [kg/m^3]
    A_rate: 4.97777e8    # [1/s]    PATO A[2][2]=A[2][3]=4.97777e8
    E_act:  169975.0     # [J/mol]  PATO E[2][2]=E[2][3]
    m_exp:    3.0
    h_decomp: 0.0        # [J/kg]   PATO h[2][2]=h[2][3]=-4e6 not used

