# Gas porosity (PATO TACOT_v3 constantProperties)
eps_g_virgin: 0.8
eps_g_char:   0.85

# Pyrolysis gas elemental composition (mass fractions [C, H, O, N]).
# PATO zeta: C=0.494996, H=0.136912, O=0.368092, N=0.0
# Used by element-transport solver; constant (temperature-independent).
pyro_elem_fracs:
  C:
    - [300.0,  0.494996]
    - [4000.0, 0.494996]
  H:
    - [300.0,  0.136912]
    - [4000.0, 0.136912]
  O:
    - [300.0,  0.368092]
    - [4000.0, 0.368092]
  N:
    - [300.0,  0.0]
    - [4000.0, 0.0]

# Initial gas elemental composition inside the material [C, H, O, N].
# PATO TACOT_v3 Zx: C=0.206, H=0.679, O=0.115, N=0.0
initial_Z_elem: [0.206, 0.679, 0.115, 0.0]

# Pore tortuosity (PATO eta0 = 1.1)
tortuosity: 1.1

# Darcy permeability (from TACOT reference XLS)
permeability_virgin: 1.6e-11   # [m²]
permeability:        2.0e-11   # [m²]  char value

# Klinkenberg slip factor (estimated; Kozeny-Carman from d_pore ≈ 1 µm at 1000 K)
# K_app = K * (1 + klinkenberg_b / p); correction < 1% at 1 atm, ~7x at 100 Pa.
klinkenberg_b: 6000.0          # [Pa]  status: estimate

# B' table (row format; 8 pressures, dense B'_g coverage)
b_prime_table: tacot_v3.0_bprime_air.yaml

# Full (p, T) pyrolysis-gas equilibrium properties (M, h_g, mu), same source
# data as gas_molar_mass_table/gas_viscosity_table/h_g above (1-atm slices)
# but covering PATO's full pressure range.  When loaded, the in-depth gas
# energy path and SEB q_adv use this instead of the 1-atm slices + offset —
# matters below ~0.3 atm, where h_g(T) can differ by MJ/kg from the 1-atm
# value (equilibrium composition shift).  See
# physics/gas_enthalpy.py::pyrolysis_gas_enthalpy_abs and
# docs/verification/ablation3_debug_status.md.
gas_properties_pT: tacot_v3.0_gasProperties_pT.yaml
