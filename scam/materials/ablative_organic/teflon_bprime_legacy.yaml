  - [2000.0, 2300.0]
  - [3000.0, 2500.0]

# Fluorocarbon surface-vapor sensible enthalpy, 298 K reference. This is only a
# smooth engineering table for reference consistency in surface terms; with
# decomposing=false it is not used as an in-depth pyrolysis gas source.
h_g:
  - [200.0, -1.0e5]
  - [250.0, -5.0e4]
  - [298.0,  0.0]
  - [300.0,  2.0e3]
  - [400.0,  1.1e5]
  - [500.0,  2.3e5]
  - [600.0,  3.6e5]
  - [700.0,  5.0e5]
  - [800.0,  6.5e5]
  - [900.0,  8.1e5]
  - [1000.0, 9.8e5]
  - [1200.0, 1.34e6]
  - [1500.0, 1.88e6]
  - [2000.0, 2.80e6]
  - [2500.0, 3.75e6]
  - [3000.0, 4.75e6]

# Converts the sensible h_g table above to the Cantera absolute reference used
# by teflon_bprime_air.yaml. Value is h(C2F4, 298 K, 1 atm) from the bundled
# ptfe_fluorine_ablation Cantera mechanism.
h_g_abs_offset: -6.584746229e6

emissivity: 0.85
emissivity_char: 0.85

b_prime_table: teflon_bprime_air.yaml
