# TACOT v3.0 — 3-reaction Arrhenius kinetics variant
#
# This file is identical to tacot_v3.0.yaml in all thermal / enthalpy / B' properties
# but uses THREE Arrhenius components that exactly match PATO's constantProperties
# (AblationTestCase_1.0 / AblationTestCase_2.x, TACOT directory).
#
# PATO phase model:
#   Phase 1 — fiber: rhoI=1600, epsI=0.10  → 160 kg/m³ apparent, nPyroReac=0 (inert)
#   Phase 2 — matrix: rhoI=1200, epsI=0.10 → 120 kg/m³ apparent, nPyroReac=3
#     Reaction 1: F[2][1]=0.25 → rho_0 = 0.25*120 = 30.0 kg/m³ apparent
#     Reaction 2: F[2][2]=0.19 → rho_0 = 0.19*120 = 22.8 kg/m³ apparent
#     Reaction 3: F[2][3]=0.06 → rho_0 = 0.06*120 =  7.2 kg/m³ apparent
#     Non-reactive residual: (1-0.50)*120 = 60 kg/m³ → implicit in rho_char
#
# See docs/physics/tacot_kinetics_2rxn_vs_3rxn.md for the mapping derivation and
# for the rules to correctly merge reactions into the 2-component form.
#
# Note on h_decomp:
#   PATO constantProperties lists h[2][j] = -4e6 J/kg for each reaction.
#   The PATO ablation1/ablation2 tutorials run with detailedSolidEnthalpies=no,
#   meaning the Pyrolysis energy model uses ONLY h_bar from the enthalpy tables
#   (h_virgin, h_char below) and NOT the per-reaction h[2][j].
#   h_decomp=0 here is therefore correct for these test cases.
#   If running a PATO case with detailedSolidEnthalpies=yes, set h_decomp=-4e6.

name: TACOT_3rxn
description: "TACOT 3.0, 3 Arrhenius reactions matching PATO constantProperties exactly"
material_category: ablative_organic
dataset_version: "3.0"
card_version: "1.0"
status: verified

rho_virgin:  280.0   # [kg/m^3]  = 30 + 22.8 + 7.2 + 60 (inert) + 160 (fiber)
rho_char:    220.0   # [kg/m^3]  = 60 (inert matrix) + 160 (fiber)
gamma_resin: 0.5

# Arrhenius kinetics — PATO constantProperties values, apparent densities
# SCAM rate: drho_i/dt = -A_i * rho_0_i * ((rho_i - rho_r_i) / rho_0_i)^m_i
#                      = -A_i * (rho_i - rho_r_i)^m_i / rho_0_i^{m_i-1}
# All rho_r=0: the component fully pyrolyzes; non-reactive residual is implicit in rho_char.
components:
  - name: resin_A        # PATO reaction 1 of phase 2  (F[2][1]=0.25)
    rho_0:    30.0       # [kg/m^3]  = 0.25 * 120
    rho_r:     0.0       # [kg/m^3]  fully converts to gas
    A_rate: 1.2e4        # [1/s]     PATO A[2][1]
    E_act:  71130.89     # [J/mol]   PATO E[2][1]
    m_exp:    3.0        # [-]       PATO m[2][1]
    h_decomp: 0        # [J/kg]   see note above; PATO h[2][1]=-4e6

  - name: resin_B1       # PATO reaction 2 of phase 2  (F[2][2]=0.19)
    rho_0:    22.8       # [kg/m^3]  = 0.19 * 120
    rho_r:     0.0       # [kg/m^3]
    A_rate: 4.97777e8    # [1/s]     PATO A[2][2]
    E_act:  169975.0     # [J/mol]   PATO E[2][2]
    m_exp:    3.0        # [-]
    h_decomp: 0        # [J/kg]   PATO h[2][2]=-4e6

  - name: resin_B2       # PATO reaction 3 of phase 2  (F[2][3]=0.06)
    rho_0:     7.2       # [kg/m^3]  = 0.06 * 120
    rho_r:     0.0       # [kg/m^3]
    A_rate: 4.97777e8    # [1/s]     PATO A[2][3]  (identical to B1)
    E_act:  169975.0     # [J/mol]   PATO E[2][3]
    m_exp:    3.0        # [-]
    h_decomp: 0        # [J/kg]   PATO h[2][3]=-4e6

