  - [2477.777778, 2.679177]    # 4460 R, 0.43e-3              [report: 2.790]
  - [2616.666667, 2.990710]    # 4710 R, 0.48e-3              [report: 3.002]
  - [2755.555556, 3.489161]    # 4960 R, 0.56e-3              [report: 3.502]
  - [3033.333333, 4.859903]    # 5460 R, 0.78e-3              [report: 4.880]
  - [3311.111111, 6.355258]    # 5960 R, 1.02e-3              [report: 6.390]
  - [3555.555556, 7.352161]    # 6400 R, 1.18e-3              [report: 7.380]
  - [3777.777778, 9.283661]    # 6800 R, 1.49e-3              [report: 9.325]

# Table VI(b) "Char surface emissivity 0.7"
emissivity_char_table:
  - [277.777778, 0.7]
  - [3777.777778, 0.7]
emissivity_char: 0.7

# ---------------------------------------------------------------------------
# Table VI(c) - Pyrolysis gas
# ---------------------------------------------------------------------------

# Pyrolysis gas enthalpy [T_K, J/kg], SENSIBLE reference (h_g(298.15 K) = 0),
# obtained by integrating Sutton's Table VI(c) specific heat from 0 K and
# shifting. Sutton tabulates cp_g, not h_g, so this table is DERIVED (the
# integration is exact for his piecewise-linear cp; no other input was used).
#
# Sutton's cp_g is strongly non-monotonic (0.75 -> 2.00 Btu/lbm-R by 1960 R,
# back to 1.00 for 2460-3960 R, then up to 10.00 by 6960 R). That is an
# era-typical "effective cp" absorbing dissociation, and it is reproduced here
# as given. h_g is monotonic regardless, since cp_g > 0 throughout.
h_g:
  - [277.777778, -74632.6]     # 500 R,  cp_g 0.75 Btu/lbm-R
  - [555.555556, 942992.4]     # 1000 R, 1.00
  - [811.111111, 2280442.4]    # 1460 R, 1.50
  - [1088.888889, 4315692.4]   # 1960 R, 2.00
  - [1366.666667, 6060192.4]   # 2460 R, 1.00
  - [1644.444444, 7223192.4]   # 2960 R, 1.00
  - [1922.222222, 8386192.4]   # 3460 R, 1.00
  - [2200.000000, 9549192.4]   # 3960 R, 1.00
  - [2477.777778, 11148317.4]  # 4460 R, 1.75
  - [2755.555556, 13619692.4]  # 4960 R, 2.50
  - [3033.333333, 17690192.4]  # 5460 R, 4.50
  - [3311.111111, 24668192.4]  # 5960 R, 7.50
  - [3588.888889, 34553692.4]  # 6460 R, 9.50
  - [3866.666667, 45892942.4]  # 6960 R, 10.00

# h_g above is on the sensible reference by construction, and Sutton gives no
# formation enthalpy to convert it, so `h_g_abs_offset` is deliberately OMITTED
# (absent -> None -> no offset applied). Do NOT add it: a non-null offset would
# be applied on top of an already-sensible table (see pato_validation.md §11).
# NB: the key must be absent, not `null` — material_loader.py does
# `float(raw["h_g_abs_offset"]) if "h_g_abs_offset" in raw else None`, so an
# explicit `null` raises TypeError rather than meaning "no offset".

# [ASSUMED] Not in Table VI. SCAM default. See gaps item 6.
gas_molar_mass: 0.022

# ---------------------------------------------------------------------------
# Sutton data recorded for reference — NOT consumed by SCAM
# ---------------------------------------------------------------------------
# Table VI(b) char surface closure. Sutton uses finite-rate oxidation kinetics
# where SCAM expects a B' table; these values are preserved so the card is a
# complete record of Table VI, and so a B' table can be generated consistently
# with them later. See gaps item 7.
sutton_surface_kinetics:
  heat_of_combustion: 11862600.0        # 5100 Btu/lbm [J/kg]
  heat_of_sublimation: 20934000.0       # 9000 Btu/lbm [J/kg]
  frequency_factor: 218250.0            # 4.47e4 lbm/ft2-s-atm^0.5 -> kg/m2-s-atm^0.5
  activation_energy: 176983.2           # 42.3 kcal/mole [J/mole]
  reaction_order: 0.5
