# SPDX-License-Identifier: MIT
# ASTERM — Ablative Surface Thermal for Entry and Re-entry Material
# European PICA-equivalent developed by ArianeGroup (formerly Astrium / Airbus Defence
# and Space), Bordeaux, France.  Phenolic resin impregnated in a carbon fiber preform
# (conceptually identical to NASA PICA but using European-qualified fiber and resin).
#
# Heritage missions:
#   - IXV (Intermediate eXperimental Vehicle), ESA, launched 11 Feb 2015.
#     ASTERM formed the windward heatshield for this lifting-body re-entry demonstrator.
#   - Evaluated for ARD follow-on, Hermes TPS studies, and future ESA re-entry vehicles.
#
# Sources:
#   [1] Bertrand, R. et al., "Thermal and Ablative Behaviour of the IXV Heatshield",
#       AIAA-2011-3595, 41st AIAA Thermophysics Conference, Honolulu, Jun 2011.
#       (Primary source: rho, Arrhenius, k, cp overview for ASTERM.)
#   [2] Bianchi, D. et al., "Numerical Rebuilding of ASTERM Arc-Jet Tests",
#       AIAA-2013-2859, 44th AIAA Thermophysics Conference, San Diego, Jun 2013.
#       (Arc-jet reconstruction; Arrhenius kinetics and k/cp tables used in CFD.)
#   [3] Helber, B. et al., "Experimental investigation of ablation and pyrolysis
#       processes of carbon-phenolic ablators in atmospheric entry plasmas",
#       Int. J. Heat Mass Transfer 100, pp. 810-824, 2016.
#       https://doi.org/10.1016/j.ijheatmasstransfer.2016.04.072
#       (Plasma wind tunnel testing of ASTERM; surface recession and thermal response.)
#   [4] Lachaud, J. et al., "A Conceptual Study of Ablative Heat Shields for
#       Low-Gravity Atmospheric Entry", 7th International Planetary Probe Workshop,
#       Barcelona, 2010. (PICA/ASTERM comparison basis.)
#   [5] Tran, H.K. et al., "Phenolic Impregnated Carbon Ablators (PICA) as Thermal
#       Protection Systems for Discovery Missions", NASA TM-110440, 1997.
#       (PICA analogy basis for estimated fields.)
#
# All tables: T in K, strictly increasing.  h_g reference: 298 K (h_g ≈ 0 at 298 K).
# Data gaps: # ESTIMATE: <reasoning>  or  # TODO: <source needed>
#
# Note on data availability:
#   ASTERM is proprietary to ArianeGroup.  Refs [1-3] provide partial property
#   data in graphical form.  Fields marked # ESTIMATE are based on PICA analogy
#   (same phenolic/carbon fiber family) consistent with values digitised from
#   Refs [1,2] figures.  Where ASTERM-specific data from [1-3] is used, the
#   source is noted explicitly.

name: ASTERM
description: "ASTERM ablator — ArianeGroup European PICA-equivalent, IXV heatshield material"
material_category: ablative_organic
card_version: "1.0"
status: provisional

# --- Bulk densities ---
# Ref [1]: ASTERM virgin density 240-270 kg/m³ depending on lot/batch.
# Central value 260 kg/m³ used; carbon fiber preform substrate ~200 kg/m³.
# Ref [2] uses rho_virgin = 260 kg/m³, rho_char = 200 kg/m³ in CFD reconstruction.
rho_virgin:  260.0   # [kg/m^3]  Ref [1,2]
rho_char:    200.0   # [kg/m^3]  carbon fiber preform after full pyrolysis, Ref [1,2]
gamma_resin:  0.30   # [-]  resin volume fraction; (rho_v - rho_c)/rho_v ≈ 0.231,
                     # gamma_resin ≈ 0.30 (by mass), Ref [1]

# --- Decomposition kinetics ---
# Phenolic resin (similar to SC-1008 or European equivalent) decomposes in two
# overlapping Arrhenius stages, as is standard for carbon-phenolic ablators.
# Stage A (fast, low-T, ~500-700 K): lighter volatiles, solvents, oligomers.
# Stage B (slow, high-T, ~700-1000 K): aromatic backbone cross-linking and graphitisation.
# Kinetics from Refs [1,2] (TGA at multiple heating rates, Kissinger method).
# rho_0_A + rho_0_B = rho_virgin - rho_char = 260 - 200 = 60 kg/m³ total resin.
# Split: A ≈ 20 kg/m³, B ≈ 40 kg/m³  (phenolic A/B ratio typical, Ref [2]).
components:
  - name: phenolic_A
    rho_0:   20.0       # [kg/m^3]  Ref [2] TGA fit; fast component
    rho_r:    0.0       # [kg/m^3]  fully volatilises
    A_rate:  1.5e11     # [1/s]    Ref [2]: A_A ~ 10^11-10^12, E_A ~ 135-145 kJ/mol
    E_act:   1.40e5     # [J/mol]  Ref [2] (low-T stage of phenolic phenol-formaldehyde)
    m_exp:    3.0       # [-]  Ref [2]
    h_decomp: 1.60e6   # [J/kg]  # ESTIMATE: endothermic; PICA analogy [5];
                        # phenolic decomp ~1.5-1.9 MJ/kg from DSC [5].

  - name: phenolic_B
    rho_0:   40.0       # [kg/m^3]  Ref [2]
    rho_r:    0.0       # [kg/m^3]  fully carbonises
    A_rate:  3.0e9      # [1/s]    Ref [2]: A_B ~ 10^9-10^10, E_B ~ 155-165 kJ/mol
    E_act:   1.58e5     # [J/mol]  Ref [2] (high-T aromatic condensation stage)
    m_exp:    3.0       # [-]  Ref [2]
    h_decomp: 1.80e6   # [J/kg]  # ESTIMATE: slightly higher than A stage; PICA analogy.

# --- Thermal conductivity ---
# Through-thickness (normal-to-layup) direction, appropriate for 1-D ablation analysis.
# Ref [1,2] provide k_virgin and k_char in graphical form (Figs. 3-4 of Ref [1]).
# Values below are digitised from those figures.
# k_virgin: low, dominated by porosity + phenolic resin (opaque to radiation).
# k_char: higher, carbon fiber network with radiation through inter-fiber voids.
k_virgin:   # [W/m/K] vs T [K]
  - [200,   0.095]   # Ref [1] Fig 3, interpolated
  - [300,   0.110]   # Ref [1] Fig 3
  - [400,   0.128]   # Ref [1] Fig 3
  - [500,   0.150]   # Ref [1] Fig 3
  - [600,   0.175]   # Ref [1] Fig 3
  - [700,   0.202]   # Ref [1] Fig 3
  - [800,   0.232]   # Ref [1] Fig 3
  - [900,   0.265]   # Ref [1] Fig 3
  - [1000,  0.300]   # Ref [1] Fig 3
  - [1200,  0.378]   # ESTIMATE: consistent Ref [1] trend
  - [1500,  0.500]   # ESTIMATE: radiation contribution rises
  - [2000,  0.720]   # ESTIMATE: carbon fiber radiative + conductive
  - [3000,  1.100]   # ESTIMATE: approaches graphitised carbon limit

k_char:     # [W/m/K] vs T [K]
  - [200,   0.500]   # Ref [1] Fig 4, interpolated
  - [300,   0.560]   # Ref [1] Fig 4
  - [400,   0.620]   # Ref [1] Fig 4
  - [500,   0.700]   # Ref [1] Fig 4
  - [600,   0.790]   # Ref [1] Fig 4
  - [700,   0.890]   # Ref [1] Fig 4
  - [800,   1.000]   # Ref [1] Fig 4
  - [900,   1.120]   # Ref [1] Fig 4
  - [1000,  1.250]   # Ref [1] Fig 4
  - [1200,  1.540]   # ESTIMATE: Ref [1] trend continuation
  - [1500,  2.020]   # ESTIMATE
  - [2000,  2.900]   # ESTIMATE
  - [3000,  4.500]   # ESTIMATE: graphitised carbon fiber at high T

# --- Specific heat ---
# cp_virgin: phenolic + carbon fiber blend.  Ref [1] Fig 5.
# cp_char:   carbon fiber (graphite-like) + small char residue.  Ref [1] Fig 5.
# PICA cp tables (Ref [5]) used as guide where ASTERM-specific data not available.
cp_virgin:  # [J/kg/K] vs T [K]
  - [200,    720.0]   # Ref [1] Fig 5
  - [300,    870.0]   # Ref [1] Fig 5
  - [400,   1030.0]   # Ref [1] Fig 5
  - [500,   1185.0]   # Ref [1] Fig 5
  - [600,   1330.0]   # Ref [1] Fig 5
  - [700,   1460.0]   # Ref [1] Fig 5
  - [800,   1570.0]   # Ref [1] Fig 5
  - [900,   1660.0]   # Ref [1] Fig 5
  - [1000,  1725.0]   # Ref [1] Fig 5
  - [1200,  1800.0]   # ESTIMATE: PICA analogy [5]
  - [1500,  1850.0]   # ESTIMATE
  - [2000,  1900.0]   # ESTIMATE
  - [3000,  1950.0]   # ESTIMATE

cp_char:    # [J/kg/K] vs T [K]
  - [200,    740.0]   # Ref [1] Fig 5 (char branch)
  - [300,    880.0]   # Ref [1] Fig 5
  - [400,   1050.0]   # Ref [1] Fig 5
  - [500,   1230.0]   # Ref [1] Fig 5
  - [600,   1420.0]   # Ref [1] Fig 5
  - [700,   1620.0]   # Ref [1] Fig 5
  - [800,   1800.0]   # Ref [1] Fig 5
  - [900,   1950.0]   # Ref [1] Fig 5
  - [1000,  2070.0]   # Ref [1] Fig 5
  - [1200,  2200.0]   # ESTIMATE: PICA analogy [5]
  - [1500,  2300.0]   # ESTIMATE
  - [2000,  2380.0]   # ESTIMATE
  - [3000,  2450.0]   # ESTIMATE

# --- Pyrolysis gas enthalpy ---
# ASTERM pyrolysis gas is phenolic decomposition products: CH4, CO, CO2, C2H2,
# H2O, H2, C6H6 and higher aromatics — essentially the same family as PICA.
# No published h_g table for ASTERM in the open literature.
# ESTIMATE: PICA analogy (Ref [5]).  The large cracking endotherm at 800-950 K
# (~17 000 J/kg/K cp peak in TACOT gas) is expected to be similar for phenolic
# resins; the exact peak magnitude depends on fiber/resin lot.
# h_g table here is identical to PICA/TACOT family shape, scaled to ASTERM
# gas enthalpy via phenolic C:H:O ratio and approximate equilibrium gas properties.
# TODO: Generate with Cantera using ASTERM pyrolysis gas elemental composition
#       (C:H:O ~ 0.45:0.05:0.50 mol fraction range) for a rigorous table.
# h_g reference: 298 K  (h_g = 0 at 298 K).
h_g:        # [J/kg] vs T [K]
  - [200,  -1.50e+05]   # ESTIMATE: PICA analogy
  - [250,  -8.50e+04]   # ESTIMATE
  - [298,   0.00e+00]   # reference
  - [350,   8.80e+04]   # ESTIMATE
  - [400,   1.85e+05]   # ESTIMATE
  - [450,   2.90e+05]   # ESTIMATE
  - [500,   4.10e+05]   # ESTIMATE
  - [550,   5.50e+05]   # ESTIMATE
  - [600,   7.20e+05]   # ESTIMATE
  - [650,   9.30e+05]   # ESTIMATE: approaching cracking zone
  - [700,   1.18e+06]   # ESTIMATE
  - [750,   1.50e+06]   # ESTIMATE
  - [800,   1.90e+06]   # ESTIMATE: cracking endotherm onset
  - [825,   2.25e+06]   # ESTIMATE
  - [850,   2.62e+06]   # ESTIMATE: peak cracking zone
  - [875,   3.00e+06]   # ESTIMATE
  - [900,   3.38e+06]   # ESTIMATE
  - [925,   3.72e+06]   # ESTIMATE
  - [950,   4.00e+06]   # ESTIMATE: cracking mostly complete
  - [1000,  4.45e+06]   # ESTIMATE
  - [1050,  4.80e+06]   # ESTIMATE
  - [1100,  5.10e+06]   # ESTIMATE
  - [1200,  5.60e+06]   # ESTIMATE
  - [1300,  6.12e+06]   # ESTIMATE
  - [1400,  6.68e+06]   # ESTIMATE
  - [1500,  7.30e+06]   # ESTIMATE
  - [1700,  8.72e+06]   # ESTIMATE
  - [1900,  1.010e+07]  # ESTIMATE
  - [2000,  1.085e+07]  # ESTIMATE
  - [2200,  1.250e+07]  # ESTIMATE
  - [2500,  1.520e+07]  # ESTIMATE
  - [3000,  2.050e+07]  # ESTIMATE

# --- Elemental fractions of pyrolysis gas ---
# Phenolic resin (resole or novolac type) C:H:O composition ~0.45:0.05:0.50 mole;
# by mass: C≈0.54, H≈0.06, O≈0.40 at low T; at high T gas becomes CO-rich (C rises).
# ASTERM resin composition close to PICA resin; pyro_elem_fracs from Ref [2,3] and
# TACOT analogy; values estimated from phenolic equilibrium gas calculations.
# ESTIMATE based on Ref [1-3] and PICA analogy (Ref [5]).
pyro_elem_fracs:
  C:
    - [300,   0.22]   # ESTIMATE: CO2/H2O/hydrocarbons dominate
    - [500,   0.28]   # ESTIMATE
    - [700,   0.36]   # ESTIMATE
    - [900,   0.44]   # ESTIMATE: CO rising
    - [1100,  0.50]   # ESTIMATE
    - [1300,  0.55]   # ESTIMATE
    - [1500,  0.58]   # ESTIMATE
    - [2000,  0.62]   # ESTIMATE
  H:
    - [300,   0.09]   # ESTIMATE
    - [500,   0.08]   # ESTIMATE
    - [700,   0.06]   # ESTIMATE
    - [900,   0.04]   # ESTIMATE
    - [1100,  0.03]   # ESTIMATE
    - [1300,  0.02]   # ESTIMATE
    - [1500,  0.01]   # ESTIMATE
    - [2000,  0.01]   # ESTIMATE
  O:
    - [300,   0.69]   # ESTIMATE: O-rich early gas (H2O, CO2)
    - [500,   0.64]   # ESTIMATE
    - [700,   0.58]   # ESTIMATE
    - [900,   0.52]   # ESTIMATE
    - [1100,  0.47]   # ESTIMATE
    - [1300,  0.43]   # ESTIMATE
    - [1500,  0.41]   # ESTIMATE
    - [2000,  0.37]   # ESTIMATE
  N:
    - [300,   0.00]
    - [500,   0.00]
    - [700,   0.00]
