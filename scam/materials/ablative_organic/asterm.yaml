    - [1100,  0.00]
    - [1300,  0.00]
    - [1500,  0.00]
    - [2000,  0.00]

# --- Emissivity ---
# Carbon char surface: high emissivity typical of graphitic carbon.
# Virgin: slightly lower (phenolic surface).
# Ref [3] reports emissivity ~0.87-0.90 for ASTERM char in plasma wind tunnel tests.
# Ref [1] uses ε = 0.85 for ASTERM in CFD reconstruction.
emissivity:       0.85   # virgin; Ref [1]; phenolic surface
emissivity_char:  0.90   # char; Ref [3]; carbon/graphite char surface

