# Absolute-reference offset for SEB q_adv_pyro.
# h_g in this card is on the SENSIBLE reference (h_g(298K)=3200 J/kg ≈ 0).
# The SEB needs h_g on the same Cantera/NASA-9 absolute reference as h_wall from B'.
# h_g_abs(T) = h_g_sensible(T) + h_g_abs_offset
# Value = formation enthalpy of the nominal pyrolysis gas at 298 K, absolute reference:
#   CH4:0.5551,CO:0.2418,H2O:0.2031 → offset ≈ -7.090 MJ/kg (from sparse reference table)
