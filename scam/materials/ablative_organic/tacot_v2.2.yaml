# TACOT version 2.2 (air) — Theoretical Ablative Composite for Open Testing
#
# Source: TACOT_2.2 data sheet (Lachaud, Mansour, White, Laub, Bouilly, 2008).
# All values in SI units.
#
# Composition:
#   Fiber phase:  carbon fibers, rho_f=1600 kg/m³, vol fraction eps_f=0.10
#   Matrix phase: novolac phenolic, rho_m=1200 kg/m³, vol fraction eps_m=0.10
#   Porosity: phi=0.80 (gas fraction), resin volume fraction gamma=0.50
#
#   rho_virgin = (1-phi)[gamma*(rho_A+rho_B) + (1-gamma)*rho_C]
#              = 0.2 * [0.5*(300+900) + 0.5*1600] = 280 kg/m³
#   rho_char   = (1-phi)[gamma*rho_B_c + (1-gamma)*rho_C]
#              = 0.2 * [0.5*600 + 0.5*1600] = 220 kg/m³
#
# 2-reaction Goldstein (1965) kinetics in the CMA-style apparent-density form.
# Component A (low-T resin): rho_0=30, rho_r=0 — fully converts to gas.
# Component B (high-T resin): rho_0=90, rho_r=60 — 30 kg/m³ converts, 60 remains.
#   The 60 kg/m³ char residual is explicit in rho_r (unlike v3 where it is
#   implicit in rho_char).  Total char = 0 + 60 + 160(fiber) = 220 kg/m³. ✓
#
# Key difference vs TACOT v3.0: kinetics are the original Goldstein 2-component
# CMA form (A_B=4.48e9, rho_r_B=60) rather than PATO's 3-reaction constantProperties.
# The pyrolysis gas elemental composition (C:0.206, H:0.679, O:0.115) is identical,
# so the bprime_config and pyrolysis gas enthalpy table are the same as v3.

name: TACOT
description: "TACOT 2.2, through-thickness properties, 2-component Goldstein kinetics"
material_category: ablative_organic
dataset_version: "2.2"
card_version: "1.0"
status: provisional

rho_virgin:  280.0   # [kg/m^3]
rho_char:    220.0   # [kg/m^3]
gamma_resin: 0.5

# Arrhenius kinetics — apparent densities from CMA source.
# SCAM rate: drho_i/dt = -A_i * rho_0_i * ((rho_i - rho_r_i) / rho_0_i)^m_i * exp(-E_i/(R*T))
#
# This is equivalent to the CMA/Goldstein form:
#   d(rho_i)/dt = -A_i * rho_i_v * ((rho_i - rho_i_c) / rho_i_v)^psi_i * exp(-Ei/(R*T))
# with rho_i_v = rho_0_i, rho_i_c = rho_r_i.
#
# Apparent densities (scaled by (1-phi)*gamma from CMA intrinsic values):
#   A: (1-0.8)*0.5*rho_A_v  = 0.2*0.5*300  = 30 kg/m³ → rho_0=30, rho_r=0
#   B: (1-0.8)*0.5*rho_B_v  = 0.2*0.5*900  = 90 kg/m³ → rho_0=90, rho_r=60
#
# E/R values from TACOT 2.2 source (×R=8.3145 J/mol/K):
#   A: E/R=8556 K  → E=71138 J/mol
#   B: E/R=20440 K → E=169940 J/mol
components:
  - name: resin_A        # low-T component; fully converts to pyrolysis gas
    rho_0:    30.0       # [kg/m^3]  (1-phi)*gamma*(CMA rho_A_v=300) = 0.2*0.5*300
    rho_r:     0.0       # [kg/m^3]  fully converts
    A_rate: 1.2e4        # [1/s]     Goldstein (1965) A_A
    E_act:  71138.0      # [J/mol]   8556 K * 8.3145 J/mol/K
    m_exp:    3.0
    h_decomp: 0.0        # [J/kg]

  - name: resin_B        # high-T component; 30 of 90 kg/m³ converts to gas
    rho_0:    90.0       # [kg/m^3]  (1-phi)*gamma*(CMA rho_B_v=900) = 0.2*0.5*900
    rho_r:    60.0       # [kg/m^3]  inert residual explicit here (unlike v3)
    A_rate: 4.48e9       # [1/s]     Goldstein (1965) A_B
    E_act:  169940.0     # [J/mol]   20440 K * 8.3145 J/mol/K
    m_exp:    3.0
    h_decomp: 0.0        # [J/kg]

