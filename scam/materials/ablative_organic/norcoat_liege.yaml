    - [500,   0.07]  # ESTIMATE
    - [700,   0.06]  # ESTIMATE
    - [900,   0.05]  # ESTIMATE
    - [1100,  0.04]  # ESTIMATE
    - [1300,  0.03]  # ESTIMATE
    - [1500,  0.02]  # ESTIMATE
    - [2000,  0.01]  # ESTIMATE
