  - [5000, 5.79778760e+07]

# Table D.7 pyrolysis-gas molecular weight [T_K, kg/kmol]
# Numerical values are unchanged from lbm/lbmole.
gas_molecular_weight:
  - [672.222222, 32]
  - [811.111111, 26]

# Table D.8 pyrolysis-gas dynamic viscosity [T_K, Pa*s]
gas_viscosity:
  - [277.777778, 5.00915983e-07]
  - [400, 6.14165260e-07]
  - [1600, 1.48637815e-06]
  - [2000, 1.71287670e-06]

# Appendix D does not provide pyrolysis-gas elemental fractions.
pyro_elem_fracs: null

# Surface thermochemistry table is explicitly excluded from Appendix D due to length.
#
# *** B' TABLE IS UNVALIDATED — AND ITS STATED PROVENANCE IS ORPHANED. ***
# carbon_phenolic_bprime_air.yaml was generated (2026-06-13) from
# carbon_phenolic_bprime_config.yaml, whose `pyro_y` was derived from the
# `pyro_elem_fracs` that used to live in THIS file (C=0.600, H=0.240, O=0.160 at
# 700 K). Those fractions were subsequently deleted as unfounded — Appendix D
# gives no pyrolysis-gas elemental composition, and `pyro_elem_fracs` is now
# null (see above). The B' table therefore rests on an input this card no longer
# asserts, and both companion files carry their own "PROVISIONAL / NOT
# VALIDATED" warnings.
#
# Circumstantial evidence that it is nonetheless not badly wrong: the Amar §8.8
# comparison, whose recession is driven by B'_c, matches the reference to +3%
# (0.141 vs ~0.137 in). That is indirect and does not constitute validation.
# To supersede: re-derive pyro_y from a published carbon-phenolic pyrolysis-gas
# composition and regenerate with scam/tools/generate_bprime.py.
#
# The "MX-4926 class" label in those two companion files is likewise an
# unsourced assertion: Amar Appendix D never names the composite and explicitly
# states its properties may come from different carbon-phenolic composites.
b_prime_table: carbon_phenolic_bprime_air.yaml
