# SPDX-License-Identifier: MIT
# CARBON PHENOLIC - Adam Amar thesis Appendix D data
#
# Source:
#   Amar, Adam Joseph (2006), Modeling of One-Dimensional Ablation with
#   Porous Flow Using Finite Control Volume Procedure, Appendix D,
#   "Carbon-Phenolic Material Properties".
#
# Notes:
#   - All numerical data below come from Appendix D and have been converted
#     from the thesis English units to SI.
#   - Appendix D states that its properties were gathered from different sources
#     and may not all correspond to the same carbon-phenolic composite; the data
#     were used by Amar for demonstration/verification calculations, not design.
#   - Conductivity values in Tables D.3-D.4 are interpreted as Btu/(ft-s-degR).
#     NOTE: the thesis PDF literally prints "Conductivity (Btu/ft2-s)" in the
#     headers of BOTH D.3 and D.4 — an ft^2 (not ft) denominator, and no degR at
#     all. That header is wrong, and is a thesis error rather than a transcription
#     artifact: Amar's own Table 8.12 (carbon-carbon) in the same document
#     correctly prints Btu/(ft-s-degR). Fourier's law fixes the dimension of k as
#     energy/(length*time*temperature); an ft^2 denominator would instead be the
#     dimension of a film coefficient h, which cannot be a bulk material property.
#     Confirmed against an independent source: Sutton, NASA TN D-5930 (1970),
#     Table VI(a), which tabulates carbon-phenolic virgin k in an explicit
#     Btu/(ft-sec-degR) and lands within ~6% of Amar's D.3 value at the one
#     directly overlapping low-temperature point (9.0e-5 vs 9.5e-5 at 460 degR).
#     A hidden length-scale factor would have shown up as a large constant
#     offset there; it does not. The ft^1 conversion below is therefore correct.
#   - Table D.4's specific-heat column is believed to be ERRONEOUS and is NOT used;
#     it is superseded by Sutton NASA TN D-5930 Table VI(b). See the long note at
#     cp_char for the evidence and the verification result.
#   - Component densities from Table D.1 are CMA/Amar component concentrations.
#     The effective bulk contributions below multiply resin components A and B
#     by Gamma and inert binder C by (1-Gamma), consistent with Eq. 2.16.
#   - No pyrolysis-gas elemental composition is given in Appendix D; estimated
#     C/H/O/N gas elemental fractions from the previous file were removed.
#
# Unit conversions used:
#   degR_to_K:                         0.5555555555555556
#   lbm_per_ft3_to_kg_per_m3:          16.01846337396014
#   Btu_per_lbm_to_J_per_kg:           2326
#   Btu_per_lbm_degR_to_J_per_kg_K:    4186.799999999999
#   Btu_per_ft_s_degR_to_W_per_m_K:    6230.644798937008
#   ft2_to_m2:                         0.09290304000000001
#   lbm_per_ft_s_to_Pa_s:              1.488163943569554

name: CARBON_PHENOLIC
description: "Carbon-phenolic material card from Adam Amar thesis Appendix D, with char cp from Sutton NASA TN D-5930"
material_category: ablative_organic
card_version: "1.1"
status: provisional
source: "Amar 2006 thesis, Appendix D: Carbon-Phenolic Material Properties; char cp from Sutton, NASA TN D-5930 (1970), Table VI(b)"
units: SI

material_model:
  type: "Amar/CMA three-component charring composite"
  density_equation: "rho_s = Gamma*(rho_A + rho_B) + (1 - Gamma)*rho_C"
  gamma_definition: "initial resin volume fraction in virgin composite"

# Resin volume fraction Gamma from Table D.2 [-]
gamma_resin: 0.372000

# Bulk densities computed from Table D.1 and Gamma using Eq. 2.16 [kg/m^3]
rho_virgin: 1462.472891
rho_char: 1172.871888

# Heats of formation from Table D.2 [J/kg]. Footnote in the thesis
# indicates that the following properties come for carbon-phenolic 
# come from personal communication with Don Potter and David Kuntz 
# of Sandia National Laboratories.
h_f_virgin: -844338.000000
h_f_char: 0.000000
h_f_gas: 0.000000

# Absolute enthalpy tables [T_K, J/kg] computed as h_f + integral(cp dT from 0 K).
# h_f_virgin = -844338 J/kg (Amar Table D.2); h_f_char = 0 (char = reference carbon).
# These activate the h_bar_chemical path in assembly.py so the formation-enthalpy
# decomposition energy (h_bar_chem ≈ -4.264 MJ/kg, endothermic) is included.
h_virgin:
  - [255.555556, -587547.599553]
  - [422.222222, -378207.600391]
  - [533.333333, -182823.600586]
  - [811.111111, 387046.399870]
  - [1088.888889, 968546.400335]
  - [1366.666667, 1550046.400800]
  - [1644.444444, 2131546.399172]
  - [1922.222222, 2713046.399637]
  - [2777.777778, 4504066.400568]
  - [3888.888889, 6830066.400335]

# h_char is the integral of the CORRECTED cp_char (Sutton NASA TN D-5930
# Table VI(b)) — see the long note at cp_char below. h_f_char = 0, so
# h_char == integral(cp_char dT from 0 K) exactly, and h_bar_chemical
# (= rho_v*h_f_v/(rho_v-rho_c) = -4.264 MJ/kg) is unaffected by this table.
# Regenerate with scam.physics.properties.build_sensible_enthalpy_table(cp_char).
h_char:
  - [277.777778, 279120.000000]
  - [555.555556, 610575.000000]
  - [811.111111, 993085.700000]
  - [1088.888889, 1475730.700000]
  - [1366.666667, 2013618.200000]
  - [1644.444444, 2580580.700000]
  - [1922.222222, 3162080.700000]
  - [2200.000000, 3755210.700000]
  - [2477.777778, 4357063.200000]
  - [2755.555556, 4964730.700000]
  - [3033.333333, 5578213.200000]
  - [3311.111111, 6197510.700000]
  - [3588.888889, 6822623.200000]
  - [3866.666667, 7453550.700000]

# Decomposing resin components A and B from Table D.1.
# rho_0 and rho_r are effective bulk contributions [kg/m^3 of composite].
# rho_*_component are the raw converted Appendix-D component concentrations
# before multiplication by Gamma [kg/m^3 of initial resin volume].
components:
  - name: resin_A
    source_component: A
    volume_fraction_scale: 0.372000
    rho_0_component: 973.121650
    rho_r_component: 518.998213
    rho_0: 362.001254
    rho_r: 193.067335
    A_rate: 4.48000000e+09
    E_over_R: 20444.444444       # [K], converted from Table D.1 degR
    E_act: 169984.569082         # [J/mol]
    m_exp: 3.000000
    T_min: 333.333333         # [K]

  - name: resin_B
    source_component: B
    volume_fraction_scale: 0.372000
    rho_0_component: 324.373883
    rho_r_component: 0.000000
    rho_0: 120.667085
    rho_r: 0.000000
    A_rate: 1.40000000e+04
    E_over_R: 8555.555556        # [K], converted from Table D.1 degR
    E_act: 71134.846844          # [J/mol]
    m_exp: 3.000000
    T_min: 555.555556          # [K]

# Inert carbon/binder component C from Table D.1.
# Effective bulk contribution = (1 - Gamma) * raw component concentration.
inert_components:
  - name: carbon_binder_C
    source_component: C
    volume_fraction_scale: 0.628000
    rho_0_component: 1560.198333
    rho_r_component: 1560.198333
    rho_0: 979.804553
    rho_r: 979.804553
    inert: true

# Table D.3 virgin specific heat [T_K, J/kg/K]
cp_virgin:
  - [255.555556, 1004.832]
  - [422.222222, 1507.248]
  - [533.333333, 2009.664]
  - [811.111111, 2093.4]
  - [1088.888889, 2093.4]
  - [1366.666667, 2093.4]
  - [1644.444444, 2093.4]
  - [1922.222222, 2093.4]
  - [2777.777778, 2093.4]
  - [3888.888889, 2093.4]
 
# Table D.3 virgin thermal conductivity [T_K, W/m/K]
k_virgin:
  - [255.555556, 0.59191126]
  - [422.222222, 0.80998382]
  - [533.333333, 0.88475156]
  - [811.111111, 1.10905477]
  - [1088.888889, 1.34581928]
  - [1366.666667, 1.61996765]
  - [1644.444444, 1.81311764]
  - [1922.222222, 2.280416]
  - [2777.777778, 2.83494338]
  - [3888.888889, 2.83494338]

# Table D.3 virgin emissivity [T_K, -]
emissivity_virgin:
  - [255.555556, 0.85]
  - [422.222222, 0.85]
  - [533.333333, 0.85]
  - [811.111111, 0.85]
  - [1088.888889, 0.85]
  - [1366.666667, 0.85]
  - [1644.444444, 0.85]
  - [1922.222222, 0.85]
  - [2777.777778, 0.85]
  - [3888.888889, 0.85]

# Backward-compatible scalar emissivity for existing simple readers.
emissivity: 0.85

# Char specific heat [T_K, J/kg/K]
#
# *** NOT from Amar Table D.4 — D.4's specific-heat column is believed to be erroneous. ***
#
# Amar's Table D.4 tabulates char cp as 0.05 Btu/lbm-degR at 500 degR
# (= 209 J/kg/K at 278 K), rising to 0.400 at 6000 degR. The low-temperature
# end is physically impossible for a carbonized char: real graphite is
# ~700 J/kg/K at 300 K, and carbon does not fall to 209 J/kg/K until roughly
# 100-130 K. The whole column runs 4.8x low at 500 degR, converging to 0.75x
# by 6000 degR.
#
# Superseded here by Kenneth Sutton, "An Experimental Study of a Carbon-Phenolic
# Ablation Material," NASA TN D-5930 (1970), Table VI(b) "Charred material" —
# an independent measurement of the same material class, physically sane, and
# plausibly the source Amar's Appendix D was compiled from (Sutton's
# virgin cp of 0.238 Btu/lbm-degR at 460 degR matches Amar's D.3 virgin cp of
# 0.24 almost exactly).
#
# Verification evidence (examples/verification/amar_thesis/compare_amar_cp.py,
# see docs/verification/verification.md 8.8): with D.4's cp column the back-face
# temperature overshoots Amar's Fig 8.29 reference by +169 degR at t=50 s and
# grows monotonically from t=36 s; with Sutton's values the gap is within
# +/-10 degR across the entire transient. Peak surface temperature (6207 ->
# 6206 degR) and total recession (0.1419 -> 0.1413 in) are unchanged, so this
# is a clean thermal-mass correction and not a retuning of the surface closure.
# Because h_f_char = 0, h_bar_chemical = rho_v*h_f_v/(rho_v-rho_c) is
# independent of cp_char (verified identical to 3e-13 relative), so the
# decomposition energy source is untouched by this substitution.
#
# Only the cp column is superseded. k_char below is retained from Table D.4:
# it agrees with Sutton to ~1% at 2000 degR, and the verification result above
# is obtained with D.4's conductivity, so there is no evidence to change it.
# Char emissivity is likewise left at Amar's 0.85 (Sutton reports 0.7, but 0.85
# is what reproduces the Fig 8.28 surface history).
#
# Values below: Sutton Table VI(b), Btu/lbm-degR * 4186.8 -> J/kg/K.
cp_char:
  - [277.777778, 1004.832]      # 500 R,  0.240 Btu/lbm-R
  - [555.555556, 1381.644]      # 1000 R, 0.330
  - [811.111111, 1611.918]      # 1460 R, 0.385
  - [1088.888889, 1863.126]     # 1960 R, 0.445
  - [1366.666667, 2009.664]     # 2460 R, 0.480
  - [1644.444444, 2072.466]     # 2960 R, 0.495
  - [1922.222222, 2114.334]     # 3460 R, 0.505
  - [2200.000000, 2156.202]     # 3960 R, 0.515
  - [2477.777778, 2177.136]     # 4460 R, 0.520
  - [2755.555556, 2198.070]     # 4960 R, 0.525
  - [3033.333333, 2219.004]     # 5460 R, 0.530
  - [3311.111111, 2239.938]     # 5960 R, 0.535
  - [3588.888889, 2260.872]     # 6460 R, 0.540
  - [3866.666667, 2281.806]     # 6960 R, 0.545

# Table D.4 char thermal conductivity [T_K, W/m/K]
k_char:
  - [277.777778, 0.62306448]
  - [477.777778, 0.62929512]
  - [588.888889, 0.6542177]
  - [1111.111111, 1.01247978]
  - [1666.666667, 1.35828057]
  - [2222.222222, 1.71342732]
  - [2777.777778, 2.07480472]
  - [3333.333333, 2.42372083]

# Table D.4 char emissivity [T_K, -]
emissivity_char_table:
  - [277.777778, 0.85]
  - [477.777778, 0.85]
  - [588.888889, 0.85]
  - [1111.111111, 0.85]
  - [1666.666667, 0.85]
  - [2222.222222, 0.85]
  - [2777.777778, 0.85]
  - [3333.333333, 0.85]

# Backward-compatible scalar char emissivity for existing simple readers.
emissivity_char: 0.85

# Table D.5 porosity [extent_of_reaction_beta, -]
porosity:
  - [0, 0.01]
  - [0.25, 0.095]
  - [0.5, 0.18]
  - [0.75, 0.265]
  - [1, 0.35]

