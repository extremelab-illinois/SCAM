  - [600,   1030.0]   # ESTIMATE
  - [700,   1102.0]   # ESTIMATE
  - [800,   1163.0]   # ESTIMATE
  - [900,   1213.0]   # ESTIMATE
  - [1000,  1253.0]   # ESTIMATE
  - [1200,  1315.0]   # ESTIMATE
  - [1500,  1385.0]   # ESTIMATE
  - [2000,  1455.0]   # ESTIMATE

# Pyrolysis gas specific enthalpy [J/kg] vs T [K], 298 K reference.
# Same resin chemistry as SLA-561V → identical h_g(T) table (gas enthalpy is
# intensive, independent of bulk density).
# # ESTIMATE: identical to SLA-561V h_g (same silicone pyrolysis gas composition).
