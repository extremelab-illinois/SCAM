# Surface emissivity.
# Ref [2]: SLA family emissivity ~0.87 (virgin), ~0.89 (char).
# SLA-220 denser but same surface composition — emissivity essentially unchanged.
# # ESTIMATE: same as SLA-561V (consistent with Ref [2] reporting negligible
# emissivity difference across SLA density variants).
emissivity:      0.87   # ESTIMATE: same as SLA-561V (Ref [2])
emissivity_char: 0.89   # ESTIMATE: same as SLA-561V (Ref [2])

# B' TABLE NOT AVAILABLE — Si-bearing material
# SLA-220 is the same silicone/cork matrix family as SLA-561V (higher resin loading).
# Si-bearing ablation products (cyclic siloxanes, SiO) dominate surface chemistry.
# The current Cantera CNO mechanism only supports C, H, O, N; Si is absent from the _M
# element dict in bprime_evaluator.py. A C-H-O-N B' table would neglect all Si
# surface chemistry and produce incorrect B'_c values for this material.
# To generate B' tables for SLA-220:
