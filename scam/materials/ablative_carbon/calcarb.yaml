# SPDX-License-Identifier: MIT
# Calcarb® CBCF 18/2000 — Mersen rigid carbon fiber felt
#
# A low-density, orthotropic carbon fiber preform used as TPS backing insulation
# and as a standalone carbon ablator in arc-jet experiments.  Non-pyrolyzing:
# no resin, no decomposition.  Ablation occurs only through surface carbon
# oxidation (B'c chemistry).
#
# Sources:
#   [1] Torres, F., Helber, B., Turchi, A. (VKI), "AblaNTIS TN-2.2" — ZURAM
#       characterization technical note; cp formula adapted for CBCF 18/2000.
#   [2] Mersen Scotland Holytown Ltd., "Calcarb: rigid carbon thermal insulation",
#       technical guide — primary source for conductivity data on CBCF 18/2000
#       (measured in N2).
#   [3] ZURAM material_data_update.xlsx (DLR) — volume fractions, densities.
#   [4] TACOT_3.0.xls (Lachaud et al.) — reference format.
#   [5] Turchi, A., Viladegut, A., Le Quang, D., Helber, B., Chazot, O. (VKI),
#       "TN-2.4 of ESA AO/1-7664/13/NL/RA" — emissivity from pyrometer /
#       radiometer measurements (0.85–0.9 range).
#   [6] Rico Orero, J. (VKI-VUB), Master thesis — simulation of CBCF 18/2000
#       micro-structure using NASA Puma; source of through-thickness reduction
#       factor of 4 relative to in-plane conductivity.
#
# Structural data (from calcarb.txt / Refs [2][3]):
#   Gas volume fraction:   0.886
#   Fiber volume fraction: 0.114
#   Intrinsic fiber density: 1580 kg/m³
#   Permeability:          3.97e-8 m²
#   Tortuosity:            1.10
#   Isotropy:              Orthotropic (k_in-plane = 4 × k_through-thickness)
#
# Note on conductivity direction:
#   All k values below are THROUGH-THICKNESS (normal to surface), as required
#   by the 1-D SCAM solver.  The calcarb.txt data gives a polynomial fit to
#   in-N2 measurements; the through-thickness direction has a reduction factor
#   of 4 vs in-plane (Ref [6]).  Formula: k_TT = (a + b·T + c·T²) / 4
#   with a=3.275e-1, b=2.327e-4, c=1.70e-7.  Fit valid up to 2000 K per Ref [2];
#   values above 2000 K are extrapolated (trend: radiation k ~ T²).

name: Calcarb
description: "Calcarb CBCF 18/2000 — Mersen rigid carbon fiber felt, non-pyrolyzing"
material_category: ablative_carbon
card_version: "1.0"
status: provisional

rho_virgin:  180.0   # [kg/m³]  Ref [2]; CBCF 18/2000 nominal density
rho_char:    179.0   # [kg/m³]  non-pyrolyzing; set 1 kg/m³ below to satisfy loader constraint
gamma_resin: 0.00    # [-]  no resin; fully inert carbon fiber structure

# Inert material — no decomposing components.
decomposing: false
components: []

# Porous medium parameters
eps_g_virgin: 0.886  # [-]  gas volume fraction; Refs [2][3]
eps_g_char:   0.886  # [-]  same (no phase change on heating)
permeability: 3.97e-8  # [m²]  Ref [2][3]
tortuosity:   1.10     # [-]  Ref [2][3]

# Thermal conductivity — through-thickness [W/m/K] vs T [K].
# Formula from Ref [2] (in N2): k_TT = (0.3275 + 2.327e-4·T + 1.70e-7·T²) / 4
# Reduction factor of 4 for through-thickness vs in-plane (Ref [6]).
# Measured data valid up to 2000 K; values above 2000 K extrapolated.
# Note: data from N2 atmosphere; radiation contribution in air may differ slightly.
k_virgin:   # [W/m/K] vs T [K]
  - [  200, 0.0952]    # formula
  - [  300, 0.1032]    # formula
  - [  400, 0.1119]    # formula
  - [  500, 0.1216]    # formula
  - [  600, 0.1321]    # formula
  - [  700, 0.1434]    # formula
  - [  800, 0.1556]    # formula
  - [  900, 0.1687]    # formula
  - [ 1000, 0.1825]    # formula
  - [ 1100, 0.1973]    # formula
  - [ 1200, 0.2129]    # formula
  - [ 1400, 0.2466]    # formula
  - [ 1600, 0.2838]    # formula; approaching upper limit of Ref [2] fit
  - [ 1800, 0.3243]    # formula
  - [ 2000, 0.3682]    # formula; upper limit of Ref [2] fit
  - [ 2500, 0.4929]    # EXTRAPOLATED: quadratic formula
  - [ 3000, 0.6389]    # EXTRAPOLATED: quadratic formula

# Char conductivity = virgin (inert, no phase change).
k_char:     # [W/m/K] vs T [K]
  - [  200, 0.0952]
  - [  300, 0.1032]
  - [  400, 0.1119]
  - [  500, 0.1216]
  - [  600, 0.1321]
  - [  700, 0.1434]
  - [  800, 0.1556]
  - [  900, 0.1687]
  - [ 1000, 0.1825]
  - [ 1100, 0.1973]
  - [ 1200, 0.2129]
  - [ 1400, 0.2466]
  - [ 1600, 0.2838]
  - [ 1800, 0.3243]
  - [ 2000, 0.3682]
  - [ 2500, 0.4929]    # EXTRAPOLATED
  - [ 3000, 0.6389]    # EXTRAPOLATED

# Specific heat [J/kg/K] vs T [K].
# Formula from Ref [1] (AblaNTIS TN-2.2): cp = a + b·T + c/T
# with a=1850, b=0.248, c=-3.94e5.
# Formula gives unphysical negative values below ~280 K; table starts at 300 K.
# Values above 2000 K are outside the source data range (EXTRAPOLATED).
cp_virgin:  # [J/kg/K] vs T [K]
  - [  300,  611.1]    # formula  (lower end of validity)
  - [  400,  964.2]    # formula
  - [  500, 1186.0]    # formula
  - [  600, 1342.1]    # formula
  - [  700, 1460.7]    # formula
  - [  800, 1555.9]    # formula
  - [  900, 1635.4]    # formula
  - [ 1000, 1704.0]    # formula
  - [ 1100, 1764.6]    # formula
  - [ 1200, 1819.3]    # formula
  - [ 1400, 1915.8]    # formula
  - [ 1600, 2000.6]    # formula
  - [ 1800, 2077.5]    # formula
  - [ 2000, 2149.0]    # formula; upper end of Ref [1] validity
  - [ 2500, 2312.4]    # EXTRAPOLATED; formula
  - [ 3000, 2462.7]    # EXTRAPOLATED; formula (high — graphite Dulong-Petit ~2100 J/kg/K)

# Char cp = virgin cp (inert).
cp_char:    # [J/kg/K] vs T [K]
  - [  300,  611.1]
  - [  400,  964.2]
  - [  500, 1186.0]
  - [  600, 1342.1]
  - [  700, 1460.7]
  - [  800, 1555.9]
  - [  900, 1635.4]
  - [ 1000, 1704.0]
  - [ 1100, 1764.6]
  - [ 1200, 1819.3]
  - [ 1400, 1915.8]
  - [ 1600, 2000.6]
  - [ 1800, 2077.5]
  - [ 2000, 2149.0]
  - [ 2500, 2312.4]    # EXTRAPOLATED
  - [ 3000, 2462.7]    # EXTRAPOLATED

# No pyrolysis gas (inert material).
h_g:        # [J/kg] vs T [K] — zero (no pyrolysis)
  - [300,  0.0]
  - [3000, 0.0]

# Surface emissivity.
# Ref [5] reports 0.85–0.90 from pyrometer / radiometer measurements.
# Mid-range 0.87 used as scalar; no strong T-dependence reported.
emissivity:      0.87   # Ref [5] mid-range
emissivity_char: 0.87   # same (inert, no phase change)

# B' table for surface oxidation chemistry in air.
# Calcarb does not pyrolyze → B'g = 0 for standalone arc-jet use.
# Table generated by calcarb_bprime_config.yaml (see below).
b_prime_table: calcarb_bprime_air.yaml
