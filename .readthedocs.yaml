# SPDX-License-Identifier: MIT
# Read the Docs configuration — see https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# This file is identical on `main` and `public-release` (see CLAUDE.md's
# "docs/ Sphinx build" section) and lives at the repo root because RTD
# requires that. Only `public-release`, pushed to the public remote as
# `main`, is ever actually built and served by RTD — `main` here is this
# private repo's own branch and is never connected to RTD.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: true  # the same -W gate used locally and in CI-less verification

# HTML only for now: the docs use Unicode math (ρ, ε, ∫₀ᵀ, ·) that pdflatex
# chokes on. Revisit with `latex_engine = "xelatex"` in docs/conf.py before
# ever adding "pdf" here.
formats: []

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
