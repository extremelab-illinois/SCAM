# SPDX-License-Identifier: MIT
name: "TACOT Arcjet Benchmark"

geometry:
  type: slab

stack:
  layers:
    - material: TACOT
      thickness: 0.05
      n_nodes: 51
      n_subcells: 4

surface_bc:
  type: energy_balance
  alpha_conv: 5000.0
  T_aw: 8000.0
  emissivity: 0.85
  view_factor: 1.0
  T_rad_in: 0.0
  rho_e_u_e: 0.1
  C_M: 0.01
  p_e: 10000.0
  lambda_blowing: 0.5

back_bc:
  type: adiabatic

solver:
  t_end: 120.0
  dt_init: 0.01
  dt_max: 2.0
  dt_min: 1.0e-5
  dt_max_dT: 50.0
  dt_max_drho_frac: 0.05
  output_dt: 10.0
  tc_positions: [0.005, 0.010, 0.025]

materials:
  - ../../scam/materials/ablative_organic/tacot_v3.0.yaml

output:
  path: results/tacot_arcjet/
  format: csv
