# SPDX-License-Identifier: MIT
# =============================================================================
# SCAM input deck template — TACOT arcjet, full ablation
# =============================================================================
#
# Run:   python3 -m scam examples/templates/tacot_arcjet_template.yaml
# Plot:  python3 examples/templates/plot_results.py results/tacot_arcjet_template/
#
# Every supported field is listed below.  Fields marked [default: …] are
# optional; remove them to accept the default value shown.
# =============================================================================


# Human-readable case label printed at runtime and used as the HDF5 root name.
# [default: YAML filename stem]
name: "TACOT Arcjet Template"


# -----------------------------------------------------------------------------
# Geometry
# Defines the cross-sectional area function A(y) used in the FVM assembly.
# -----------------------------------------------------------------------------
geometry:
  # type: slab            — flat plate, A = 1 (constant) [default]
  # type: hollow_cylinder — annular shell, A(y) = r_inner + y
  # type: tabulated       — user-supplied [[y_m, A_m2], ...] table
  type: slab

  # Required only for hollow_cylinder: inner radius [m] at the hot face
  # r_inner: 0.05


# -----------------------------------------------------------------------------
# Material stack
# Layers are listed hot-face first (layers[0] faces the arc-jet).
# Multiple layers are supported; add contact_resistance between them if needed.
# -----------------------------------------------------------------------------
stack:
  layers:
    - material: TACOT         # must match the `name` field in the material YAML
      thickness: 0.05         # layer thickness [m]
      n_nodes: 51             # number of finite-volume nodes in this layer
      n_subcells: 4           # nodelets per node for sub-grid decomposition [default: 4]
      contact_resistance: 0.0 # thermal contact resistance at the back face [m^2 K/W] [default: 0]

    # Example second layer (inert substrate):
    # - material: Cork
    #   thickness: 0.01
    #   n_nodes: 11
    #   contact_resistance: 1.0e-4


# -----------------------------------------------------------------------------
# Surface boundary condition
# Controls how the front face exchanges heat with the environment.
# -----------------------------------------------------------------------------
surface_bc:
  # type: energy_balance  — full Newton SEB with convection + radiation + chemistry [default]
  # type: prescribed_flux — impose a net heat flux q_net(t) [W/m^2] into the material
  # type: prescribed_temp — impose surface temperature T_wall(t) [K]
  type: energy_balance

  # --- Convective heat transfer (temperature-based mode) ---
  # Convective heat transfer coefficient [W/m^2/K].
  # Accepts a scalar (constant) or a [[t_s, value], ...] table (linearly interpolated).
  # The table below ramps from 0 to 5000 W/m^2/K over the first 5 s, holds
  # through t = 100 s, then drops to zero to simulate arc-jet shutdown.
  alpha_conv:
    - [0.0,   0.0]
    - [5.0,   5000.0]
    - [100.0, 5000.0]
    - [105.0, 0.0]
    - [120.0, 0.0]

  # Adiabatic wall (recovery) temperature [K].
  # Can also be a [[t, T_aw], ...] table.  Constant here.
  T_aw: 8000.0

  # --- Convective heat transfer (enthalpy-based mode, PATO rhoUeCH style) ---
  # When rhoUeCH > 0 this mode overrides alpha_conv / T_aw.
  # q_conv = rhoUeCH * (h_r - h_gas(T_wall))
  # Uncomment to use:
  # rhoUeCH: 0.3e-2   # rho_e * u_e * C_H [kg/m^2/s]
  # h_r: 2.5e7        # recovery enthalpy [J/kg] (same reference as h_g table)

  # --- Radiation ---
  # Surface emissivity [-].  Set to -1 (or omit) to use the material card value.
  # A positive value overrides the material card for both virgin and char states.
  # [default: -1 → use material card]
  emissivity: -1

  # Geometric view factor to the cold radiation sink [-] [default: 1.0]
  view_factor: 1.0

  # Equivalent blackbody temperature of any incoming radiation source [K].
  # Adds q_rad_in = emissivity * sigma * T_rad_in^4 to the SEB.
  # Set to 0 (or omit) for an open arc-jet with no enclosure heating. [default: 0]
  T_rad_in: 0.0

  # --- Blowing correction ---
  # Reduces the effective Stanton number when pyrolysis gas and char products
  # are injected: alpha_eff = alpha_conv / (1 + lambda_blowing * B_total).
  # lambda_blowing: 0.5 = laminar, 0.4 = turbulent [default: 0.5]
  lambda_blowing: 0.5

  # Freestream mass flux rho_e * u_e [kg/m^2/s] (used to compute B' = m_dot / rho_e_u_e).
  # Set to 0 to disable blowing correction. [default: 0]
  rho_e_u_e: 0.1

  # Mass transfer Stanton number C_M [-].
  # m_dot_char = rho_e_u_e * C_M * B'_c  (used when B' table is available).
  # Set to 0 if no B' table is loaded. [default: 0]
  C_M: 0.01

  # Edge pressure [Pa] for B' table lookup. [default: 101325]
  p_e: 10000.0

  # --- Prescribed-mode parameters (only used when type != energy_balance) ---
  # Net heat flux [W/m^2] into the material.  Positive = into material.
  # Accepts a scalar or a [[t, q], ...] table.
  # q_prescribed: 1.0e6

  # Surface temperature [K].  Accepts a scalar or a [[t, T], ...] table.
  # T_prescribed: 3000.0


# -----------------------------------------------------------------------------
# Back-face boundary condition
# -----------------------------------------------------------------------------
back_bc:
  # type: adiabatic       — zero heat flux (thermally insulated) [default]
  # type: prescribed_temp — hold the back face at a fixed temperature
  # type: prescribed_flux — inject heat from behind (positive = into material)
  # type: radiation       — the back face re-radiates to an enclosure, and/or
  #                         loses heat through a convective film:
  #                             q_loss = eps*sigma*F*(T_back^4 - T_env_back^4)
  #                                      + h_back*(T_back - T_env_back)
  #                         Requires emissivity_back and/or h_back.  Example:
  #   type: radiation
  #   emissivity_back: 0.85     # [-]  back-face emissivity (0 disables the T^4 term)
  #   T_env_back: 300.0         # [K]  enclosure temperature (accepts a [[t,v],...] table)
  #   view_factor_back: 1.0     # [-]  optional, default 1
  #   h_back: 0.0               # [W/m^2/K] optional free-convection film
  type: adiabatic

  # Used when type: prescribed_temp.  Accepts a scalar or [[t, T], ...] table.
  # T_back: 300.0

  # Used when type: prescribed_flux [W/m^2].  Positive = into material.
  # q_back: 0.0


# -----------------------------------------------------------------------------
# Solver options
# -----------------------------------------------------------------------------
solver:
  t_start: 0.0      # simulation start time [s] [default: 0]
  t_end: 120.0      # simulation end time [s] [default: 10]

  # --- Adaptive time step ---
  dt_init: 0.01     # initial timestep [s] [default: 1e-3]
  dt_min: 1.0e-5    # minimum allowed timestep [s] [default: 1e-7]
  dt_max: 2.0       # maximum allowed timestep [s] [default: 1.0]
  dt_max_dT: 50.0   # max |ΔT| per step in any cell [K] [default: 50]
  dt_max_drho_frac: 0.05  # max |Δρ/ρ| per step in any nodelet [-] [default: 0.05]

  # --- Surface energy balance Newton solver ---
  max_seb_iter: 50  # max Newton iterations [default: 50]
  seb_tol: 1.0      # residual convergence tolerance [W/m^2] [default: 1.0]

  # --- In-depth Picard iteration ---
  # The tridiagonal system is re-assembled and re-solved until T converges.
  # max_picard=1 reproduces old single-pass (no iteration) behaviour.
  max_picard: 8     # max Picard iterations per timestep [default: 8]
  picard_tol: 0.05  # convergence criterion: max |T_new - T_k| [K] [default: 0.05]

  # --- Recession ---
  # Set to false to suppress surface recession (in-depth pyrolysis only).
  allow_recession: true   # [default: true]

  # Recession mesh scheme.
  # false (default) — Lagrangian: surface cell shrinks and is dropped/merged
  #   when thin; produces a small sawtooth in T_wall (~±6 K per node drop).
  # true — ALE: nodes redistributed every step between receding surface and
  #   fixed back face; no discrete drops, T_wall is smooth.  Requires a
  #   tighter dt limit (dt ≤ 0.1·h/s_dot, enforced automatically).
  continuous_remap: false   # [default: false]

  # --- Energy storage formulation ---
  # true  (default) — exact d(ρh)/dt with h_old at pre-decomposition ρ_old.
  # false — PATO approximation: ρ·dh/dt ≈ ρ·cp·dT/dt (no density-change term).
  use_rho_old: true   # [default: true]

  # --- Advanced physics ---
  # Enable element-transport PDE (Z_C, Z_H, Z_O, Z_N through porous medium).
  # Requires pyro_elem_fracs in the material card and a 4-D B' table.
  element_transport: false   # [default: false]

  # Use live Cantera B' evaluation instead of the pre-computed YAML table.
  # Much slower (~10–100 ms/call); use only for reference runs.
  # Requires pip install -e ".[bprime]" and a bprime_config companion file.
  bprime_runtime: false   # [default: false]

  # --- Output ---
  output_dt: 10.0   # interval between saved snapshots [s] [default: 0.1]

  # Thermocouple probe depths [m] measured from the ORIGINAL (t=0) front face.
  # Temperatures are interpolated from the nodal field at each output step.
  tc_positions: [0.005, 0.010, 0.025]   # [default: [] — no TCs]


# -----------------------------------------------------------------------------
# Material files
# Paths are resolved relative to this YAML file's directory.
# Every material referenced in stack.layers must appear here.
# -----------------------------------------------------------------------------
materials:
  - ../../scam/materials/ablative_organic/tacot_v3.0.yaml
  # - ../../scam/materials/ablative_organic/cork.yaml   # add if using a sublayer


# -----------------------------------------------------------------------------
# Output
# -----------------------------------------------------------------------------
output:
  path: results/tacot_arcjet_template/   # directory for output files [default: results/]

  # format: csv   — two CSV files: time_history.csv and temperature_profiles.csv [default]
  # format: hdf5  — single HDF5 file (requires: pip install -e ".[hdf5]")
  format: csv
